<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suna - Listen Music And Vibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="utility.css">
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "Google Sans", sans-serif;
        }

        body{
            display: flex;
            height: 100vh;
            flex-direction: column;
            background-color: black;
            color: white;
        }
        header{
            position: absolute;
            height: 65px;
            width: 100%;
            background-color: black;
            align-content: center;
        }

        .logo{
            display: flex;
            align-items: center;
            margin-left: 20px;
        }
        .logo img{
            height: 50px;
            width: 50px;
        }
        .middle-nav{
            width: 40%;
        }
        .home{
            background-color: #8080804c;
        }
        .search{
            background-color: #8080804c;
            border-radius: 25px;
            width: 70%;
            margin-left: 7px;
        }

        .search input{
            background-color: transparent;
            border: none;
            outline: none;
            color: white;
            width: 90%;

        }


    </style>
</head>
<body>
    <header>
        <nav class="flex item-center" style="justify-content: space-between;">
            <div class="logo flex item-center" >
                <img src="Image/Screenshot 2026-09-23 200027.png" alt="logo">
                <h2>Suna</h2>
            </div>
            <div class="middle-nav flex item-center">
                <img src="Image/home.svg" alt="home" class="home svg">
                <div class="search justify-center flex item-center">
                    <img src="Image/search.svg" alt="search" class="svg">
                    <input type="text" placeholder="What do you want to listen?">
                </div>
            </div>
            <div class="user-nav">

            </div>
        </nav>
    </header>
</body>
</html>
